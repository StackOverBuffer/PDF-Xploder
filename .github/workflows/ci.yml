name: CI

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  # Keeps the app fast as features land (scripts/perf/): the JavaScript needed for the start
  # page stays within budget, on-demand features stay out of it, and the start page and the
  # sample's first page show within their time budgets. Budgets: scripts/perf/budget.json.
  perf:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run perf:bundle
      - run: npx playwright install --with-deps chromium
      - run: npm run perf:startup

  # Opens, draws, saves and qpdf-checks pdf.js's test PDFs (scripts/corpus/run.ts).
  # Problems listed in scripts/corpus/known-issues.json are reported, new ones fail the job.
  corpus:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: sudo apt-get install -y --no-install-recommends qpdf
      - uses: actions/cache@v4
        with:
          path: .corpus/pdfs
          key: pdfjs-corpus-${{ hashFiles('scripts/corpus/fetch.sh') }}
      - run: scripts/corpus/fetch.sh
      - run: npm run corpus
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: corpus-results
          path: .corpus/results.json
          if-no-files-found: ignore
